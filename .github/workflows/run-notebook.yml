name: Run Notebook and Upsert to Supabase

on:
  schedule:
    - cron: "*/5 * * * *"    # Triggers at 2:00 AM UTC daily
  workflow_dispatch:         # Allows manual triggering from GitHub UI

jobs:
  run-script:
    runs-on: ubuntu-latest    # Run this job on the latest Ubuntu VM

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        # This pulls your GitHub repo code so the job can access your files

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: 'pip'
          architecture: 'x64'
        # This installs Python 3.10 on the runner

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.24.3
          pip install pandas==2.0.3
          pip install scikit-learn==1.3.0
          pip install matplotlib==3.7.2
          pip install seaborn==0.12.2
          pip install python-dotenv==1.0.0
          pip install supabase==1.0.3
        # Installs Python packages from requirements.txt

      - name: Run your script
        env:
          SUPABASE_DEMO_URL: ${{ secrets.SUPABASE_DEMO_URL }}
          SUPABASE_DEMO_API: ${{ secrets.SUPABASE_DEMO_API }}
        run: |
          echo "Environment variables:"
          echo "SUPABASE_DEMO_URL: ${{ secrets.SUPABASE_DEMO_URL != '' && 'Present' || 'Missing' }}"
          echo "SUPABASE_DEMO_API: ${{ secrets.SUPABASE_DEMO_API != '' && 'Present' || 'Missing' }}"
          python rec_test.py
        # This runs your notebook (converted to .py), and passes in Supabase secrets