name: Run Notebook and Upsert to Supabase

on:
  schedule:
    - cron: "*/5 * * * *"  # Every 5 minutes (use "0 2 * * *" for 2:00 AM UTC daily)
  workflow_dispatch:       # Manual trigger via GitHub UI

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.24.3 \
                      pandas==2.0.3 \
                      scikit-learn==1.3.0 \
                      matplotlib==3.7.2 \
                      seaborn==0.12.2 \
                      python-dotenv==1.0.0 \
                      supabase==1.0.3

      - name: Check required secrets
        run: |
          echo "Checking secrets..."
          if [ -z "${{ secrets.SUPABASE_DEMO_URL }}" ]; then
            echo "❌ SUPABASE_DEMO_URL is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_DEMO_API }}" ]; then
            echo "❌ SUPABASE_DEMO_API is not set!"
            exit 1
          fi
          echo "✅ Secrets are properly set."

      - name: Run Python script
        env:
          GITHUB_ACTIONS: "true"
          SUPABASE_DEMO_URL: ${{ secrets.SUPABASE_DEMO_URL }}
          SUPABASE_DEMO_API: ${{ secrets.SUPABASE_DEMO_API }}
        run: |
          echo "Running script with Supabase credentials..."
          python rec_test.py
